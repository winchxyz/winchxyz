# Generates the contribution-graph snake and pushes it to the `output` branch.
# The README embeds it from raw.githubusercontent.com/winchxyz/winchxyz/output/...
name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Clay palette — matches the README. Levels run empty → clay.
          outputs: |
            dist/github-snake.svg?color_snake=#3A2A22&color_dots=#EDE8E1,#EFCDB9,#E0A184,#D97757,#A84F32
            dist/github-snake-dark.svg?color_snake=#E8E3DD&color_dots=#161210,#4A3225,#8A4E36,#C06544,#D97757

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
