# Generates the contribution-graph snake and pushes it to the `output` branch.
# The README embeds it from raw.githubusercontent.com/winchxyz/winchxyz/output/...
name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Signal palette — matches the README. Levels run empty → lime.
          # Light mode ends deeper than the accent: #C6F24E alone is too pale
          # to read as "max activity" against a white page.
          outputs: |
            dist/github-snake.svg?color_snake=#1C2418&color_dots=#EDF0E6,#DFF0BC,#C6F24E,#A3CC3C,#7A9E22
            dist/github-snake-dark.svg?color_snake=#E9EDE3&color_dots=#10140E,#33401C,#6B8A2B,#9DC93C,#C6F24E

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
